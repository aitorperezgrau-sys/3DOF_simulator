[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket3"
version = "0.1.0"
authors = [
  { name="Aitor Pérez Grau", 
  email="aitor.perez.grau@gmail.com", 
  linkedin ="https://www.linkedin.com/in/aitor-perez-grau/"},
]
description = "A 3DOF trajectory simulator for sounding rockets."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]

[tool.setuptools.packages.find]
include = ["rocket3*"]